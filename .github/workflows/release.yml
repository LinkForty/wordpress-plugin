name: Release

# Every push to main is a release candidate. semantic-release reads the
# conventional commits since the last tag, and when one warrants a release it
# writes the version into linkforty.php and readme.txt, prepends CHANGELOG.md,
# builds the zip, commits `chore(release): x.y.z [skip ci]`, tags vX.Y.Z and
# publishes a GitHub release with the zip attached. Configuration:
# .releaserc.json; version writer: scripts/set-version.sh.

on:
  push:
    branches:
      - main

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    if: github.repository == 'LinkForty/wordpress-plugin' && github.ref == 'refs/heads/main'
    timeout-minutes: 15

    permissions:
      contents: write # release commit, tag, GitHub release
      issues: write # comments on issues a release fixes
      pull-requests: write # comments on released pull requests

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # semantic-release needs every tag and commit
          persist-credentials: false

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          tools: composer

      - run: composer install --no-interaction --no-progress

      - run: composer lint

      - run: composer phpcs

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release
